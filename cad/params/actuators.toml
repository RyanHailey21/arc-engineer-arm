# Actuators.  Every joint and the gripper run Feetech STS3215 serial-bus servos (12 V version) on one TTL bus.
# Read by cad/arm/core.py (STS), the four-bar gripper, tools/quick_check.py and cad/sim/export_robot.py.

[STS3215]                 # Feetech STS3215, 12 V (Feetech spec 2020-04-10; Amazon B0FKY4Z15R listing)
rated_Nm = 0.98           # 10 kg*cm rated (continuous) at 12 V
stall_Nm = 2.94           # 30 kg*cm stall at 12 V; no-load speed 0.222 s/60 deg (4.72 rad/s)
hold_frac = 0.5           # project rule for hobby servos: static holding torque <= 50 % of stall (report R4)

[BASE]                    # J1 shoulder and J2 elbow: STS3215 through a printed m2 18T/54T spur stage
ratio = 3.0               # 8.4 N*m stall, 2.8 N*m rated, 1.57 rad/s no-load at the joint
efficiency = 0.95         # one spur mesh

[DM_J4340]                # Damiao DM-J4340-2EC joint motor (BASE_DRIVE=DIRECT only): 24 V, 40:1 planetary, CAN; drives the
                          # J1/J2 hub directly (data/catalogue.toml "DM-J4340-2EC"; interfaces/dm_j4340__*.toml)
rated_Nm = 9.0            # rated (continuous) output torque, Damiao spec
peak_Nm = 27.0            # peak output torque, Damiao spec
hold_frac = 1.0           # a geared BLDC joint motor holds at its continuous rating (the 50 %-of-stall rule is for hobby servos)
rotor_share = 0.30        # share of the catalogue mass modelled in the output-flange (rotor) part, which turns with the hub;
                          # the stator part carries the rest (estimate; the joint torque barely depends on it: the rotor is on the axis)

[BUS]                     # one Feetech TTL bus for all five STS3215 (2026-11-28; the build guide's servo setup reads it)
baud = 1000000            # factory default; keep it
J1 = 1                    # shoulder (left drive frame, 3:1)
J2 = 2                    # elbow (right drive frame, 3:1)
J3 = 3                    # wrist pitch (cradle on the level member)
J4 = 4                    # wrist roll (roll housing)
GRIP = 5                  # four-bar gripper (palm)
