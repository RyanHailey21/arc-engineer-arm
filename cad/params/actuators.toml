# Actuators.  Every joint and the gripper run Feetech STS3215 serial-bus servos (12 V version) on one TTL bus.
# Read by cad/arm/core.py (STS), the four-bar gripper, tools/quick_check.py and cad/sim/export_robot.py.

[STS3215]                 # Feetech STS3215, 12 V (Feetech spec 2020-04-10; Amazon B0FKY4Z15R listing)
rated_Nm = 0.98           # 10 kg*cm rated (continuous) at 12 V
stall_Nm = 2.94           # 30 kg*cm stall at 12 V
speed_s_per_60deg = 0.222 # no-load at 12 V (4.72 rad/s)
hold_frac = 0.5           # project rule for hobby servos: static holding torque <= 50 % of stall (report R4)

[BASE]                    # J1 shoulder and J2 elbow: STS3215 through a printed m2 18T/54T spur stage
ratio = 3.0               # 8.4 N*m stall, 2.8 N*m rated, 1.57 rad/s no-load at the joint
efficiency = 0.95         # one spur mesh
