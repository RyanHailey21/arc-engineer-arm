# Gripper variant SCREW (rev A): Tr8x8 bidirectional lead screw driven by a DJI M2006 through m1 20T/32T,
# jaws on 2x MGN9 rails, constant-torque spring motor for the power-off release.  Gripper frame, mm.
# Read by cad/arm/grippers/screw.py; derived there: HXJ = HX + HXJ_OFF, XR = XR_OFF + HXJ, ZM = ZS + ZM_OFF.

LEAD = 8.0            # Tr8x8 4-start lead: free-running, so the spring motor can spin it open (power-off release)
Z_SCREW_T = 32        # screw gear teeth (m1)
Z_MOTOR_T = 20        # motor gear teeth (m1): 1.6:1 reduction, 35 mm/s per jaw, finer grip-force control
HXJ_OFF = 6.0         # rails / jaws datum behind HX (clears the hub flange)
XR_OFF = 41.0         # rail centre line (= lead-screw axis x) ahead of HXJ
ZS = 31.0             # lead-screw axis z
ZM_OFF = 26.0         # M2006 axis above the screw: m1 20T + 32T centre distance
ZTOP = 78.0           # end-block top / CF bridge underside
YEB = 103.0           # end-block inner face |y|
RAIL_END = 100.0      # MGN9 rail outer end |y|
MOT_FACE = 1.0        # M2006 gearbox front face y; the 16.5 mm D6 output shaft runs through the 20T gear towards -y
M2006_FRONT = 42.0    # vendor STEP: gearbox front face at model y = 42, output shaft 42..58.5
GEAR_Y0 = -4.6        # gear face planes (y)
GEAR_Y1 = 0.4

[M2006_HOLES]         # M2006 gearbox face screws (vendor drawing)
pcd = 18.4
ang = [1, 121, 241]
