# Arm geometry: kinematic dimensions, plate layer stack and drive details.  mm, degrees.
# Frame: X forward from the chassis front bumper, Y left, Z up from the Battlefield floor.
# Read by cad/arm/core.py (K, Y, T, ROD2_T, ROD2_W, HUB_R, UA_HUB_SCREWS) and cad/arm/upper_arm.py (harness).

T = 3.0                  # CF plate thickness (every plate in the layer stack)

[K]                      # kinematics (paper's palletizer topology, links scaled ~2.4x)
SX = -160.0              # shoulder axis x (J1/J2 coaxial)
SZ = 215.0               # shoulder axis z
L1 = 80.0                # crank / ground-lever length (parallelogram drive of the forearm)
L2 = 340.0               # upper arm, shoulder S -> elbow E
L3 = 350.0               # forearm, elbow E -> wrist pitch axis D
GRIP = 151.0             # wrist pitch axis -> TCP, along the gripper x axis
DROP = 20.0              # TCP below the wrist pitch axis (gripper frame z = -DROP)
V1_LEN = 70.0            # level-keeping stage-1 ground lever length
V1_ANG = 192.0           # level-keeping stage-1 ground lever angle (deg)
V2_LEN = 43.0            # level-keeping stage-2 lever length (rocker at E and level member at D; replaces the GT2 belt)
V2_ANG = 72.7            # stage-2 lever angle (deg, absolute: both levers keep constant orientation). The parallelogram's
                         # dead points are th2 = 72.7 and -107.3 (rod collinear with E-D); 72.7 centres both in the gaps
                         # beyond the task elbow range -82.6 .. +48.0: margins 24.7 deg (rod force <= 2.4x mid-range).
                         # Levers point UP: pointing down (-107.3) put the level member's lever into the scoring platform
                         # at DONUT_PLACE (wrist axis only 82.5 above the floor). 43 (not 50) + the rod-2 notch + the palm
                         # corner reliefs clear the gripper at PIPE_CHUTE and PIPE_CHUTE_ROLL90 (pitch 90, >= 3 deg spare).
                         # Rod offset from E-D at the task extremes 18.0 mm: 3 mm off the D14 hubs; elbow limits -86 .. +51.
DECK_Z = 120.0           # chassis deck top (placeholder chassis)

[Y]                      # layer stack: centre planes of the plates (y, mm); see the arm_model.py docstring
FL = -18.0               # forearm plate L (R is +18)
ROD2 = -33.0             # level-keeping rod 2 centre plane (4 mm rod, y -35..-31): 1 mm washer to the rocker/level plates
                         # (-36); pin head on the inboard face ends at -27, 2 mm clear of the wrist clevis plate L (-25)
ROCK = -37.5             # rocker / level member
ROD1 = -42.0             # level-keeping rod 1
UA = -45.5               # upper-arm plate L (R is +45.5)
TW = -51.0               # motor tower L (R is +51)
RAB = 29.0               # rod AB (forearm drive rod)
CRANK = 34.5             # crank (J2 side)

[level_keeping]
ROD2_T = 4.0             # rod 2 thickness: CF plate, buckling 313 N with the wrist-end notch (E 50 GPa, L 350) vs 134 N worst (SF 2.35)
ROD2_W = 16.0            # rod 2 width (eyes r 8 around MR105, wall 3)

[j1_hub]
HUB_R = 19.5             # J1/J2 output hub flange radius (inside the D42 tower bore)
UA_HUB_SCREWS = [30.0, 150.0, 270.0]   # J1 hub -> UA-L: 3x M3 on PCD20 (deg)

[harness]
UA_CLIP_YZ = [-52.3, 9.0]              # harness bundle centre in the UA frame (y, z): 47 + 5.3 outboard of the UA plate
