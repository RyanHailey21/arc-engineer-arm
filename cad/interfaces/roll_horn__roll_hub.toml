# Interface: J4 roll servo horn <-> roll hub rear wall
# Frame: gripper frame at roll 0 (x forward along the roll axis, y left, z up; origin on the wrist pitch axis). mm.

[interface]
name = "roll_horn__roll_hub"
summary = "Roll hub rear wall screws to the 25T aluminium disc horn on the J4 roll servo with 4x M3"
owner = "roll stage (wrist)"

[frame]
origin = [49.0, 0.0, -5.0]             # hub rear face on the roll axis (horn face side)
normal = [1.0, 0.0, 0.0]

[pattern]
radius = 7.0                           # horn PCD 14 (hardware.HORN_PCD)
angles_deg = [45.0, 135.0, 225.0, 315.0]

[side_a]                               # disc horn (catalogue, holes tapped)
body = "HEAD"
part = "Servo_Horn_25T_roll"
hole = "tapped"
thread = "M3x0.5"

[side_b]                               # roll hub rear wall
body = "HEAD"
part = "Roll_Hub"
hole = "clearance"
clearance_d = 3.3
depth = 5.0                            # x 48..53 (through the 4 mm rear wall)

[fastener]
kind = "BHCS"
size = "M3"
length = 5.0
head_face_x = 52.0                     # screws go in from inside the hub towards the horn
